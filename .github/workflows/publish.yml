name: Publish to NuGet (Trusted Publishing)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for NuGet.org OIDC Trusted Publishing (NuGet/login@v1)

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish-nuget:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release, Warnings as Errors)
        run: dotnet build --configuration Release --no-restore

      - name: Run unit & stress tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack NuGet package (Meai.CostGuard)
        run: dotnet pack src/AiCostGuard/AiCostGuard.csproj --configuration Release --no-build --output ./artifacts

      - name: NuGet login via OIDC Trusted Publishing (short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER || github.repository_owner }}

      - name: Push package to nuget.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
